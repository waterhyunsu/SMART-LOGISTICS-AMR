# 연구 1 (A* vs Dijkstra) 시나리오. tools/r1_bench.py 가 읽는다. 설명: experiments/r1/README.md
#
# worlds.<월드>.map       : 계획·위치 추정에 쓰는 맵 yaml (저장소 기준 경로, 또는 turtlebot3_navigation2 = 패키지 기본 맵)
# worlds.<월드>.points    : 이름: [x, y, 도착 방향(도)] (맵 좌표 = Gazebo 월드 좌표)
# scenarios[].from / to   : 출발 / 목표 지점 이름. reverse: true(기본)면 반대 방향(to → from)도 같은 횟수 측정
# scenarios[].obstacles   : 맵에 없는 새 장애물 상자 [중심 x, 중심 y, 가로, 세로, 회전(도)]
#                           offline = 계획 격자에 장애물로 넣음 (LiDAR 로 기억한 장애물과 같은 값 100)
#                           sim     = 시도 직전에 Gazebo 에 상자로 생성, 끝나면 삭제 (로봇이 LiDAR 로 발견 → 재계획)
# scenarios[].sim         : false 면 Gazebo 주행은 건너뜀 (계획만)
# scenarios[].expect      : reach (도착) | replan (막혀서 재계획 후 도착) | fail (경로 없음 → 실패 처리)

worlds:
  # 강의실 복제 월드 (tools/make_hall_world.py --real). 실제 시연 장소(교육 강의실)와 가장 비슷한 월드
  #   실내 x -1.85 ~ 6.45, y -0.45 ~ 8.95. 뒤쪽 가로 복도 y=0, 앞쪽 가로 복도 y≈6.5, 강단(빈 공간) y 6.95 ~ 8.95
  #   세로 복도 x = 0, 2.3, 4.6 (폭 0.9 m), 좌석 줄 사이 틈 0.15 m (로봇이 못 지나감)
  lecture_hall_real:
    map: experiments/r1/maps/lecture_hall_real.yaml
    amcl: hall
    spawn: [0.0, 0.0]                  # Gazebo 출발 위치 (run.sh / run_nav2_sim.sh)
    points:
      home:        [0.0, 0.0, 90]      # 출발 위치 (뒤쪽 가로 복도 x 세로 복도 2)
      back_left:   [-1.2, 0.0, 0]
      back_mid:    [1.15, 0.0, 90]     # 좌석 2열 바로 뒤
      back_right:  [5.6, 0.0, 180]
      front_mid:   [1.15, 6.5, 0]      # 좌석 2열 바로 앞 (앞쪽 가로 복도)
      front_v2:    [0.0, 6.5, 90]
      aisle4_mid:  [4.6, 3.3, 90]      # 세로 복도 4 가운데
      stage_left:  [-1.0, 7.9, 0]
      stage_right: [5.6, 7.9, 180]
    scenarios:
      - id: R1-A
        name: 개방 경로
        from: stage_left
        to: stage_right
        expect: reach
        note: 강단 빈 공간을 가로지름. 장애물이 없어 휴리스틱이 가장 잘 맞는 경우
      - id: R1-B
        name: 장애물 우회
        from: back_mid
        to: front_mid
        expect: reach
        note: 직선 위에 좌석 블록(책상·의자 5줄)이 있어 세로 복도로 돌아가야 함
      - id: R1-C
        name: 좁은 통로·갈림길
        from: back_left
        to: aisle4_mid
        expect: reach
        note: 뒤쪽 복도의 갈림길 2곳을 지나 폭 0.9 m 세로 복도 안으로 들어감
      - id: R1-D1
        name: 경로 차단 (재계획)
        from: home
        to: front_v2
        reverse: false
        obstacles:
          - [0.0, 3.3, 0.8, 0.3, 0]      # 세로 복도 2 가운데를 막음 → 세로 복도 3 으로 재계획
        expect: replan
        note: 맵에 없는 상자가 원래 경로(세로 복도 2)를 막음
      - id: R1-D2
        name: 경로 차단 (경로 없음)
        from: home
        to: stage_right
        reverse: false
        obstacles:                        # 세로 복도 3개를 모두 막음 → 강단으로 가는 길이 없음
          - [0.0, 3.3, 0.8, 0.3, 0]
          - [2.3, 3.3, 0.8, 0.3, 0]
          - [4.6, 3.3, 0.8, 0.3, 0]
        expect: fail
        note: 경로가 없을 때 두 알고리즘 모두 도달 가능한 칸을 전부 탐색해야 실패를 판정함

  # TurtleBot3 기본 월드 + 패키지 기본 맵 (Docker 기본 실행 모드 그대로). 육각형 벽 안에 기둥 3x3 (간격 1.1 m)
  #   기둥 사이 통로(x, y = ±0.55)는 로봇 반경을 빼면 폭이 10 cm 남짓이라 좁은 통로·갈림길 비교에 씀. 두 번째 환경(주로 계획만)
  turtlebot3_world:
    map: turtlebot3_navigation2
    amcl: default
    spawn: [-2.0, -0.5]
    points:
      spawn:        [-2.0, -0.5, 0]     # Gazebo 출발 위치
      west:         [-2.0, 0.0, 0]
      east:         [2.0, 0.0, 180]
      south_left:   [-1.0, -1.85, 0]
      south_right:  [1.0, -1.85, 180]
      inner_cross:  [0.55, 0.55, 90]    # 기둥 사이 통로가 만나는 곳
    scenarios:
      - id: R1-A
        name: 개방 경로
        from: south_left
        to: south_right
        expect: reach
        note: 아래쪽 빈 띠를 가로지름
      - id: R1-B
        name: 장애물 우회
        from: west
        to: east
        expect: reach
        note: 직선 위에 기둥 3개 (y=0 줄) → 기둥 사이 통로나 바깥 고리로 돌아감
      - id: R1-C
        name: 좁은 통로·갈림길
        from: spawn
        to: inner_cross
        expect: reach
        note: 기둥 사이 좁은 통로가 만나는 안쪽 교차점으로 들어감

  # 큰 맵 시험 (README 7.4): 물류 창고 40 x 30 m (tools/make_warehouse_world.py), 맵 825 x 624 칸 = 강의실의 12.7배
  #   랙 구역 x 3~11, 14~22, 25~33 / 랙 사이 통로 1.5 m (가운데 y = 4.25, 6.75, ... ) / 주 통로 y 13.5~17.5 / 구역 사이 통로 3 m
  #   서쪽 통로 x 0~3, 동쪽 하역장 x 33~40 (팔레트 4개), 홈 (37, 15.5)
  warehouse_large:
    map: experiments/r1/maps/warehouse_large.yaml
    amcl: hall
    spawn: [37.0, 15.5]
    points:
      home:        [37.0, 15.5, 180]
      dock_s:      [36.5, 1.5, 90]
      dock_n:      [36.5, 28.5, -90]
      z2_south:    [18.0, 4.25, 90]     # 구역 2, 1번째 랙 통로
      z2_north:    [18.0, 11.75, 90]    # 구역 2, 4번째 랙 통로
      far_nw:      [5.0, 24.25, 180]    # 구역 1, 맨 위 랙 통로 (홈에서 가장 먼 쪽)
      corridor_w:  [1.5, 15.5, 180]     # 주 통로 서쪽 끝
      dead_end:    [7.0, 6.75, 0]       # 구역 1, 2번째 랙 통로 (L-D2 에서 양 끝을 막음)
    scenarios:
      - id: L-A
        name: 개방 경로 (하역장 26 m)
        from: dock_s
        to: dock_n
        expect: reach
        note: 하역장 빈 공간을 남북으로 가로지름
      - id: L-B
        name: 랙 우회
        from: z2_south
        to: z2_north
        expect: reach
        note: 직선 위에 랙 3줄 → 구역 사이 통로로 돌아감
      - id: L-C
        name: 창고 끝에서 끝
        from: home
        to: far_nw
        expect: reach
        note: 하역장에서 반대편 구역 1 맨 위 통로까지 (약 40 m)
      - id: L-D1
        name: 경로 차단 (재계획)
        from: home
        to: corridor_w
        reverse: false
        obstacles:
          - [18.0, 15.5, 0.8, 4.0, 0]       # 구역 2 의 주 통로를 막음 → 랙 통로로 우회
        expect: replan
      - id: L-D2
        name: 경로 차단 (경로 없음)
        from: home
        to: dead_end
        reverse: false
        obstacles:                          # 목표가 있는 랙 통로의 양 끝을 막음
          - [2.8, 6.75, 0.4, 1.5, 0]
          - [11.2, 6.75, 0.4, 1.5, 0]
        expect: fail

