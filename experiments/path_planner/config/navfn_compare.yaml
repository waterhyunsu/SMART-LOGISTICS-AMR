# B 연구 1 비교 설정 — Nav2 Jazzy planner_server 하나에 NavFn 두 개를 올리고 use_astar 만 다르게 둔다.
# 요청마다 ComputePathToPose.planner_id 로 고른다. 두 플러그인은 같은 global costmap 을 공유한다.
#
# - planner_id 와 algorithm 은 이 파일에서 정한다. config_version 은 run_compare.py 가 이 파일 내용의 해시로 기록한다.
# - global costmap 은 정적 지도 비교용이다: static + inflation 만 쓰고 obstacle layer(LiDAR)는 넣지 않는다.
#   D 의 실제 주행 설정(amr_navigation)과는 다르며, 배포 설정은 D 와 협의해 정한다 (INTERFACES §9).
# - robot_radius 0.22 m, inflation 0.55 m / 3.0 은 Nav2 기본값이며 legacy_r1 실험과 같다.

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["NavFnAStar", "NavFnDijkstra"]
    NavFnAStar:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true
    NavFnDijkstra:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename 은 launch 인자 map:=... 로 넘긴다.
