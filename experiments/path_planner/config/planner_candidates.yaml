# B 연구 1 후보 비교 설정 — navfn_compare.yaml 의 NavFn 두 개에 Smac Planner 2D 를 세 번째 후보로 더했다.
#
# - NavFnAStar / NavFnDijkstra 블록과 global costmap 은 navfn_compare.yaml 과 같다 (tests 가 확인한다).
# - Smac2D 는 nav2_smac_planner::SmacPlanner2D 다. 정확한 우선순위 큐를 쓰는 격자 A* 로, NavFn 의 use_astar 모드와
#   구현이 다르다 (REPORT.md §2.1). 값은 Nav2 Jazzy 문서의 기본값이고 tolerance 만 NavFn 과 같은 0.5 로 맞췄다.
# - 세 플러그인은 같은 global costmap 을 공유한다. 요청마다 ComputePathToPose.planner_id 로 고른다.
# - 후보를 Smac 2D 까지 넓히는 것은 [초안-팀합의필요] 다 (P-009 는 B·D 검증과 A 승인 사항).

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 20.0
    planner_plugins: ["NavFnAStar", "NavFnDijkstra", "Smac2D"]
    NavFnAStar:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: true
      allow_unknown: true
    NavFnDijkstra:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      allow_unknown: true
    Smac2D:
      plugin: "nav2_smac_planner::SmacPlanner2D"
      tolerance: 0.5                      # Nav2 기본값은 0.125. NavFn 두 개와 같은 값으로 맞췄다
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      robot_radius: 0.22
      resolution: 0.05
      track_unknown_space: true
      always_send_full_costmap: true
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55

map_server:
  ros__parameters:
    use_sim_time: false
    # yaml_filename 은 launch 인자 map:=... 로 넘긴다.
